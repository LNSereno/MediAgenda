<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Novo médico</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main><a th:href="@{/}">← Voltar</a><h1>Cadastrar médico</h1><form th:action="@{/doctors}" th:object="${doctor}" method="post"><label>Nome<input th:field="*{name}" required></label><label>CRM<input th:field="*{crm}" required></label><label>Especialidade<input list="especialidades" th:field="*{specialty}" required><datalist id="especialidades"><option value="Clínica médica"></option><option value="Cardiologia"></option><option value="Pediatria"></option><option value="Dermatologia"></option></datalist></label><label>Telefone<input type="tel" th:field="*{phone}" required></label><label>E-mail<input type="email" th:field="*{email}" required></label><p class="message error" th:each="err : ${#fields.allErrors()}" th:text="${err}"></p><button>Salvar médico</button></form></main></body></html>
