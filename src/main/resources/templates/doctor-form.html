<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastrar médico | MediAgenda</title><link rel="stylesheet" th:href="@{/css/clinical.css}"></head>
<body><main class="clinical-screen registration">
<h1>Cadastrar médico</h1>
<form th:action="@{/doctors}" th:object="${doctor}" method="post">
<p class="notice error" th:each="err : ${#fields.allErrors()}" th:text="${err}"></p>
<label for="name">Nome completo</label>
<input id="name" type="text" th:field="*{name}" placeholder="Nome do médico" required>
<label for="crm">CRM</label>
<input id="crm" type="text" th:field="*{crm}" placeholder="000000-PE" required>
<label for="phone">Telefone</label>
<input id="phone" type="tel" th:field="*{phone}" placeholder="(00) 00000-0000" required>
<label for="email">Email</label>
<input id="email" type="email" th:field="*{email}" placeholder="medico@email.com" required>
<label for="specialty">Especialidade</label>
<select id="specialty" th:field="*{specialty}" required>
<option value="">Selecione a especialidade</option>
<option value="Cardiologia">Cardiologia</option><option value="Clínica médica">Clínica médica</option><option value="Dermatologia">Dermatologia</option>
<option value="Ginecologia">Ginecologia</option><option value="Neurologia">Neurologia</option><option value="Ortopedia">Ortopedia</option>
<option value="Pediatria">Pediatria</option><option value="Psiquiatria">Psiquiatria</option><option value="Outra">Outra</option>
</select><div class="actions"><a href="/">Cancelar</a><button type="submit">Salvar</button></div>
</form></main></body></html>
