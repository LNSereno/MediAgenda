<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar prontuário | MediAgenda</title>
  <link rel="stylesheet" th:href="@{/css/clinical.css}">
</head>
<body>
<main class="clinical-screen">
  <a class="back" href="/">Voltar à agenda</a>
  <p class="notice success" role="status" th:if="${success}" th:text="${success}"></p>

  <section class="panel">
    <h1>Registrar prontuário</h1>
    <p class="context"><span th:text="${appointment.patient.name}"></span> ·
      <span th:text="${#temporals.format(appointment.scheduledAt, 'dd/MM/yyyy HH:mm')}"></span></p>
    <p class="notice error" role="alert" th:if="${error}" th:text="${error}"></p>
    <form method="post" th:action="@{/appointments/{id}/record(id=${appointment.id})}">
      <label for="diagnosis">Diagnóstico</label>
      <textarea id="diagnosis" name="diagnosis" rows="2" maxlength="4000" required
                placeholder="Descreva o diagnóstico" th:text="${diagnosis}"></textarea>
      <label for="prescription">Prescrição</label>
      <textarea id="prescription" name="prescription" rows="2" maxlength="4000" required
                placeholder="Medicamentos e orientações" th:text="${prescription}"></textarea>
      <label for="notes">Observações</label>
      <input id="notes" name="notes" maxlength="4000" placeholder="Observações gerais" th:value="${notes}">
      <button type="submit">Salvar prontuário</button>
    </form>
  </section>
  <section th:replace="~{clinical-fragments :: history}"></section>
</main>
</body>
</html>
