<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MediAgenda</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><header><img th:src="@{/logo.svg}" alt="MediAgenda"><div><h1>MediAgenda</h1><p>Agenda simples para o consultório</p></div></header>
<main><p class="message success" th:if="${success}" th:text="${success}"></p><p class="message error" th:if="${error}" th:text="${error}"></p>
<nav><a th:href="@{/patients/new}">Cadastrar paciente</a><a th:href="@{/doctors/new}">Cadastrar médico</a><a th:href="@{/appointments/new}">Agendar consulta</a></nav>
<section><h2>Consultas</h2><p th:if="${#lists.isEmpty(appointments)}">Nenhuma consulta cadastrada.</p><table th:unless="${#lists.isEmpty(appointments)}"><thead><tr><th>Data e hora</th><th>Paciente</th><th>Médico</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr th:each="appointment : ${appointments}"><td th:text="${#temporals.format(appointment.scheduledAt, 'dd/MM/yyyy HH:mm')}"></td><td th:text="${appointment.patient.name}"></td><td th:text="${appointment.doctor.name}"></td><td th:text="${appointment.status}"></td><td><form th:if="${appointment.status.name() == 'AGENDADA'}" th:action="@{/appointments/{id}/confirm(id=${appointment.id})}" method="post"><button>Confirmar presença</button></form><form th:if="${appointment.status.name() != 'CANCELADA'}" th:action="@{/appointments/{id}/cancel(id=${appointment.id})}" method="post"><label>Motivo <input name="reason" required></label><button class="danger">Cancelar</button></form><small th:if="${appointment.status.name() == 'CANCELADA'}" th:text="${appointment.cancellationReason}"></small></td></tr></tbody></table></section>
<section class="columns"><div><h2>Pacientes</h2><ul><li th:each="patient : ${patients}" th:text="${patient.name + ' - ' + patient.cpf}"></li></ul></div><div><h2>Médicos</h2><ul><li th:each="doctor : ${doctors}" th:text="${doctor.name + ' - ' + doctor.specialty}"></li></ul></div></section></main></body></html>
