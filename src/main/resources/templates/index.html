<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MediAgenda</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><header><img th:src="@{/logo.svg}" alt="MediAgenda"><div><h1>MediAgenda</h1><p>Agenda simples para o consultório</p></div></header>
<main><p class="message success" th:if="${success}" th:text="${success}"></p><p class="message error" th:if="${error}" th:text="${error}"></p>
<nav><a th:href="@{/patients/new}">Cadastrar paciente</a><a th:href="@{/doctors/new}">Cadastrar médico</a><a th:href="@{/appointments/new}">Agendar consulta</a></nav>
<section><h2>Consultas</h2><p th:if="${#lists.isEmpty(appointments)}">Nenhuma consulta cadastrada.</p><table th:unless="${#lists.isEmpty(appointments)}"><thead><tr><th>Data e hora</th><th>Paciente</th><th>Médico</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr th:each="appointment : ${appointments}"><td th:text="${#temporals.format(appointment.scheduledAt, 'dd/MM/yyyy HH:mm')}"></td><td th:text="${appointment.patient.name}"></td><td th:text="${appointment.doctor.name}"></td><td th:text="${appointment.status}"></td><td><a th:href="@{/appointments/{id}(id=${appointment.id})}">Ver consulta</a></td></tr></tbody></table></section>
<section><h2>Pacientes</h2>
<table><thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>Email</th></tr></thead>
<tbody><tr th:each="patient : ${patients}"><td><a th:href="@{/patients/{id}/history(id=${patient.id})}" th:text="${patient.name}"></a></td><td th:text="${patient.cpf}"></td><td th:text="${patient.phone}"></td><td th:text="${patient.email}"></td></tr></tbody></table>
<p th:if="${#lists.isEmpty(patients)}">Nenhum paciente cadastrado.</p></section>
<section><h2>Médicos</h2><ul><li th:each="doctor : ${doctors}" th:text="${doctor.name + ' — ' + doctor.specialty}"></li></ul></section>
</main></body></html>
